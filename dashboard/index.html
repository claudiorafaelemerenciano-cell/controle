<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Secretária IA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234f46e5'/%3E%3Cpath d='M8 7h2.5l1 3-1.5 1a8 8 0 0 0 3 3l1-1.5 3 1V16a1 1 0 0 1-1 1A9 9 0 0 1 7 8a1 1 0 0 1 1-1z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Ir para o conteúdo</a>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      </span>
      <div class="brand-text">
        <h1>Secretária IA</h1>
        <p id="owner" class="muted small">Carregando…</p>
      </div>
    </div>
    <div class="status-group" role="status" aria-live="polite">
      <span id="sip-pill" class="pill pill-off"><span class="dot" aria-hidden="true"></span><span id="sip-text">Verificando…</span></span>
      <span id="active-pill" class="pill pill-neutral"><span id="active-count">0</span> <span id="active-label">ligações ativas</span></span>
    </div>
    <button id="new-call-btn" class="btn btn-primary" type="button" aria-label="Nova ligação">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Nova ligação</span>
    </button>
  </div>
</header>

<main id="main" class="wrap">
  <div class="tabs" role="tablist" aria-label="Seções">
    <button role="tab" id="tab-calls" aria-controls="panel-calls" aria-selected="true" class="tab" type="button">Ligações</button>
    <button role="tab" id="tab-messages" aria-controls="panel-messages" aria-selected="false" tabindex="-1" class="tab" type="button">Recados <span id="msg-count" class="count" hidden></span></button>
  </div>

  <div id="net-banner" class="banner" role="alert" hidden></div>

  <section id="panel-calls" role="tabpanel" aria-labelledby="tab-calls" class="split">
    <div class="pane pane-list">
      <ul id="call-list" class="list" aria-label="Lista de ligações"></ul>
    </div>
    <div class="pane pane-detail" id="detail-pane" aria-live="polite">
      <div id="detail" class="detail"></div>
    </div>
  </section>

  <section id="panel-messages" role="tabpanel" aria-labelledby="tab-messages" hidden>
    <ul id="message-list" class="list msg-list" aria-label="Lista de recados"></ul>
  </section>
</main>

<dialog id="call-dialog" aria-labelledby="dlg-title">
  <form id="call-form" method="dialog" novalidate>
    <header class="dlg-head">
      <h2 id="dlg-title">Nova ligação</h2>
      <button type="button" class="icon-btn" id="dlg-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="field">
      <label for="f-to">Número de telefone</label>
      <input id="f-to" name="to" type="tel" inputmode="tel" autocomplete="off" placeholder="+5511987654321" aria-describedby="f-to-hint f-to-err" required>
      <p id="f-to-hint" class="hint">Use o formato internacional (E.164), por exemplo +5511987654321.</p>
      <p id="f-to-err" class="err" role="alert" hidden></p>
    </div>
    <div class="field">
      <label for="f-purpose">Objetivo da ligação</label>
      <textarea id="f-purpose" name="purpose" rows="4" maxlength="1000" placeholder="Ex.: Confirmar a consulta de amanhã às 15h com a Dra. Helena." aria-describedby="f-purpose-err" required></textarea>
      <p id="f-purpose-err" class="err" role="alert" hidden></p>
    </div>
    <p id="form-err" class="err form-err" role="alert" hidden></p>
    <footer class="dlg-foot">
      <button type="button" class="btn" id="dlg-cancel">Cancelar</button>
      <button type="submit" class="btn btn-primary" id="dlg-submit">Ligar agora</button>
    </footer>
  </form>
</dialog>

<dialog id="auth-dialog" aria-labelledby="auth-title">
  <form id="auth-form" method="dialog">
    <header class="dlg-head"><h2 id="auth-title">Acesso restrito</h2></header>
    <p class="muted">Informe o token de acesso para continuar.</p>
    <div class="field">
      <label for="f-token">Token de acesso</label>
      <input id="f-token" type="password" autocomplete="off" required>
    </div>
    <footer class="dlg-foot"><button type="submit" class="btn btn-primary">Entrar</button></footer>
  </form>
</dialog>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script>if(/[?&]mock=1/.test(location.search))document.write('<script src="mock.js"><\/script>');</script>
<script src="app.js"></script>
</body>
</html>
