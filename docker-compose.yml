# Secretária virtual por telefone: Asterisk (SIP/RTP) + agente Python (IA).
#
# Ambos usam network_mode: host — o jeito mais simples e confiável para SIP/RTP
# (sem NAT do Docker no meio). Requer Linux. Portas usadas no host:
#   5060/udp (SIP), RTP_START-RTP_END/udp (mídia), 8080/tcp (API/painel),
#   127.0.0.1:9092 (AudioSocket), 127.0.0.1:5038 (AMI).
services:
  asterisk:
    build: ./asterisk
    network_mode: host
    env_file: .env
    restart: unless-stopped
    volumes:
      - asterisk-logs:/var/log/asterisk

  agent:
    build: ./agent
    network_mode: host
    env_file: .env
    environment:
      DB_PATH: /data/controle.db
      DASHBOARD_DIR: /dashboard
      KNOWLEDGE_FILE: /config/knowledge.md
    restart: unless-stopped
    depends_on:
      - asterisk
    volumes:
      - ./config:/config:ro
      - ./dashboard:/dashboard:ro
      - agent-data:/data

volumes:
  asterisk-logs:
  agent-data:
